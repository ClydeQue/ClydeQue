<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Software projects and systems</title>
  <desc id="desc">Dark gradient banner for full-stack engineering projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".55" stop-color="#0b1730"/><stop offset="1" stop-color="#07111f"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#94a3b8" stroke-opacity=".08"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="55" r="230" fill="url(#glow)" filter="url(#soft)"><animate attributeName="opacity" values=".55;1;.55" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="110" cy="330" r="190" fill="#8b5cf6" opacity=".07" filter="url(#soft)"/>
  <text x="70" y="145" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="51" font-weight="750" letter-spacing="-1.5">SOFTWARE PROJECTS &amp; SYSTEMS</text>
  <rect x="70" y="180" width="545" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="230" fill="#a5f3fc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="650" letter-spacing="1.5">FULL-STACK ENGINEERING</text>
  <text x="410" y="230" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">·</text>
  <text x="440" y="230" fill="#c4b5fd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="650" letter-spacing="1">RELIABLE PRODUCT DELIVERY</text>
  <text x="70" y="285" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">web / desktop / mobile / offline / cloud</text>
  <text x="70" y="320" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ARCHITECTURE / DATA / DELIVERY / OPERATIONS</text>
  <path d="M1050 262h60m-30-30v60" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity=".75"><animateTransform attributeName="transform" type="rotate" from="0 1080 262" to="360 1080 262" dur="18s" repeatCount="indefinite"/></path>
</svg>
